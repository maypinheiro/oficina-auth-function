name: Deploy Functions and Gateway

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [homolog, main]
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [hml, prod]

permissions:
  contents: read

concurrency:
  group: oficina-auth-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'prod' || 'hml') }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'prod' || 'hml') }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'prod' || 'hml') }}
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
      TF_VAR_environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'prod' || 'hml') }}
      TF_VAR_lambda_role_arn: arn:aws:iam::982623100545:role/LabRole
      TF_VAR_private_subnet_ids: ${{ secrets.PRIVATE_SUBNET_IDS_JSON }}
      TF_VAR_lambda_security_group_ids: ${{ secrets.LAMBDA_SECURITY_GROUP_IDS_JSON }}
      TF_VAR_vpc_link_subnet_ids: ${{ secrets.PRIVATE_SUBNET_IDS_JSON }}
      TF_VAR_vpc_link_security_group_ids: ${{ secrets.VPC_LINK_SECURITY_GROUP_IDS_JSON }}
      TF_VAR_database_secret_arn: ${{ secrets.DATABASE_SECRET_ARN }}
      TF_VAR_jwt_private_key_secret_arn: ${{ secrets.JWT_PRIVATE_KEY_SECRET_ARN }}
      TF_VAR_jwt_public_key_base64: ${{ secrets.JWT_PUBLIC_KEY_BASE64 }}
      TF_VAR_backend_listener_arn: ${{ secrets.BACKEND_LISTENER_ARN }}
      TF_VAR_cors_allowed_origins: ${{ vars.CORS_ALLOWED_ORIGINS_JSON }}
      TF_VAR_datadog_lambda_layer_arn: ${{ vars.DATADOG_LAMBDA_LAYER_ARN }}
      TF_VAR_datadog_extension_layer_arn: ${{ vars.DATADOG_EXTENSION_LAYER_ARN }}
      TF_VAR_datadog_api_key_secret_arn: ${{ secrets.DATADOG_API_KEY_SECRET_ARN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.DEPLOY_REF }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run package
      - name: Export artifact hash
        run: echo "TF_VAR_source_code_hash=$(openssl dgst -sha256 -binary artifact/oficina-auth.zip | openssl base64 -A)" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Load JWT public key from Secrets Manager
        run: |
          PUBLIC_KEY_BASE64=$(aws secretsmanager get-secret-value --secret-id "oficina-${{ env.DEPLOY_ENV }}/auth/signing-public" --query SecretString --output text | jq -r '.JWT_PUBLIC_KEY_BASE64')
          test -n "$PUBLIC_KEY_BASE64"
          test "$PUBLIC_KEY_BASE64" != "null"
          echo "::add-mask::$PUBLIC_KEY_BASE64"
          echo "TF_VAR_jwt_public_key_base64=$PUBLIC_KEY_BASE64" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with: { terraform_version: 1.6.6 }
      - name: Plan
        working-directory: infra
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="key=auth/${{ env.DEPLOY_ENV }}/terraform.tfstate" -backend-config="region=${AWS_REGION}" -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}" -backend-config="encrypt=true" && terraform plan -out=tfplan
      - name: Apply
        working-directory: infra
        run: terraform apply -auto-approve tfplan
      - name: Smoke test authentication endpoint
        working-directory: infra
        env:
          SMOKE_TEST_CPF: ${{ secrets.SMOKE_TEST_CPF }}
        run: |
          ENDPOINT=$(terraform output -raw api_gateway_endpoint)
          curl --fail --silent --show-error --request POST "$ENDPOINT/auth/clientes" --header 'content-type: application/json' --data "{\"cpf\":\"$SMOKE_TEST_CPF\"}" --output /tmp/auth-response.json
          jq --exit-status '.token | type == "string" and length > 0' /tmp/auth-response.json >/dev/null
          echo "Authentication smoke test succeeded."
          TOKEN=$(jq --raw-output '.token' /tmp/auth-response.json)
          curl --fail --silent --show-error "$ENDPOINT/health" --output /tmp/health-response.json
          curl --fail --silent --show-error "$ENDPOINT/clientes" --header "authorization: Bearer $TOKEN" --output /tmp/protected-response.json
          jq --exit-status 'type == "array"' /tmp/protected-response.json >/dev/null
          unset TOKEN
          echo "Private integration and authorizer smoke tests succeeded."
          terraform output -json > deployment-outputs.json
      - name: Authentication and private integration diagnostics
        if: failure()
        working-directory: infra
        run: |
          aws logs tail "/aws/lambda/oficina-auth-${{ env.DEPLOY_ENV }}-authenticate" --since 10m --format short
          VPC_LINK_ID=$(terraform output -raw vpc_link_id)
          aws apigatewayv2 get-vpc-link --vpc-link-id "$VPC_LINK_ID" --query '{Status:VpcLinkStatus,Message:VpcLinkStatusMessage,Subnets:SubnetIds,SecurityGroups:SecurityGroupIds}'
          TARGET_GROUP_ARN=$(aws elbv2 describe-listeners --listener-arns "$TF_VAR_backend_listener_arn" --query 'Listeners[0].DefaultActions[0].TargetGroupArn' --output text)
          aws elbv2 describe-target-health --target-group-arn "$TARGET_GROUP_ARN" --query 'TargetHealthDescriptions[].{Target:Target.Id,Port:Target.Port,State:TargetHealth.State,Reason:TargetHealth.Reason,Description:TargetHealth.Description}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auth-deployment-${{ env.DEPLOY_ENV }}-${{ env.DEPLOY_REF }}
          path: infra/deployment-outputs.json
